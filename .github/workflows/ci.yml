name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SeldonLattice.slnx

      - name: Build
        run: dotnet build SeldonLattice.slnx -c Release --no-restore

      # xUnit v3 ships an in-process runner, so no external test host is required.
      - name: Test
        run: dotnet run --project tests/SeldonLattice.Domain.Tests -c Release --no-build

      - name: Verify the tamper demo
        run: dotnet run --project samples/VerificationDemo -c Release --no-build
